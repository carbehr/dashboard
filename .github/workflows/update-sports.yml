name: Lokalsport-Daten aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: lokalsport-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt
      - name: Sportdaten abrufen
        run: python scripts/update_sports.py
      - name: Geaenderte Daten speichern
        run: |
          if git diff --quiet -- data/sports-data.json; then
            echo "Keine Aenderung"
            exit 0
          fi
          git config user.name "lokalsport-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sports-data.json
          git commit -m "Lokalsportdaten aktualisieren"
          git push
