<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1628">
<title>Lokalsport Schwerin · 2026/27</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg">
<style>
:root{--bg:#07111f;--panel:#0a1628;--card:#111c2d;--line:#22324a;--text:#f8fafc;--muted:#9aa7b7;--green:#22c55e;--orange:#f97316;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);background:rgba(10,22,40,.97);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:9px}.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,#1f9d55,#2563eb);display:grid;place-items:center}h1{font-size:16px;margin:0}.season,.headmeta{font-size:10px;color:var(--muted)}.headmeta{text-align:right}.toolbar{display:flex;gap:7px;align-items:center;padding:7px 9px;border-bottom:1px solid var(--line);background:var(--panel)}button,select{font:inherit;color:var(--text);background:#15243a;border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:12px}button{cursor:pointer}.status{margin-left:auto;font-size:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:7px;max-width:1600px;margin:auto}.card{--sport:var(--orange);position:relative;background:linear-gradient(180deg,#111c2d,#0e1929);border:1px solid var(--line);border-radius:12px;padding:8px 9px;min-height:142px;display:flex;flex-direction:column;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sport)}.football{--sport:var(--green)}.handball{--sport:var(--blue)}.volleyball{--sport:var(--orange)}.top{display:flex;justify-content:space-between;gap:7px}.club{font-size:13px;font-weight:750;line-height:1.15}.league{font-size:9px;color:var(--muted);margin-top:2px}.badge{font-size:8px;padding:2px 5px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}.badge.ok{color:#86efac}.badge.manual{color:#fcd34d}.badge.stale{color:#fca5a5}.rankline{display:flex;align-items:baseline;gap:5px;margin:5px 0 3px}.rank{font-size:24px;font-weight:850}.ranklabel{font-size:10px;color:var(--muted)}.info{display:grid;grid-template-columns:76px 1fr;gap:5px;border-top:1px solid #1c2b40;padding-top:5px;margin-top:4px;font-size:10.5px}.label{color:var(--muted)}.value{text-align:right;font-weight:600}.next .value{font-weight:750}.countdown{color:#93c5fd;font-size:9px;display:block;margin-top:2px}.foot{margin-top:auto;padding-top:5px;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:7px;font-size:8px;color:#708198}.leagueLink{color:#bfdbfe;text-decoration:none;border:1px solid #29476d;background:#10233c;border-radius:6px;padding:2px 6px;font-weight:700;white-space:nowrap}.leagueLink:hover,.leagueLink:focus{color:#fff;border-color:#60a5fa;background:#173458}.notice{display:none;margin:0 7px 7px;padding:7px 9px;border:1px solid #77591a;background:#2a210d;border-radius:10px;font-size:10px;color:#fde68a}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){header{padding:8px 9px}.grid{gap:5px;padding:5px}.card{padding:7px;min-height:150px}.club{font-size:11px}.league{font-size:8px}.rank{font-size:21px}.info{grid-template-columns:58px 1fr;font-size:9px;gap:3px}.status{display:none}.foot{gap:4px}.leagueLink{padding:2px 5px}}@media(max-width:360px){.grid{grid-template-columns:1fr}.card{min-height:auto}}@media(min-width:1100px) and (min-height:650px){body{overflow:hidden}.grid{height:calc(100vh - 92px);grid-auto-rows:1fr}.card{min-height:0}}
</style></head><body>
<header><div class="brand"><div class="logo">🏟️</div><div><h1>Lokalsport Schwerin</h1><div class="season">Saison 2026/27 · 8 Teams</div></div></div><div class="headmeta"><div id="updated">Daten werden geladen …</div><div id="freshness">GitHub-Automatik</div></div></header>
<div class="toolbar"><button id="refresh">↻ Aktualisieren</button><select id="filter"><option value="all">Alle</option><option>Volleyball</option><option>Fußball</option><option>Handball</option></select><div class="status" id="status">Lade …</div></div><div class="notice" id="notice"></div><main class="grid" id="grid"></main>
<script>
const grid=document.querySelector('#grid'),updated=document.querySelector('#updated'),freshness=document.querySelector('#freshness'),statusEl=document.querySelector('#status'),filter=document.querySelector('#filter'),notice=document.querySelector('#notice');let allClubs=[];
const esc=s=>String(s??'–').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const safeUrl=u=>{try{const x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch{return'#'}};
const ageHours=i=>i?(Date.now()-new Date(i))/36e5:Infinity;
function badge(c){if(c.sourceStatus==='manual')return['manual','manuell'];if(c.sourceStatus==='ok'&&ageHours(c.dataUpdatedAt)<36)return['ok','aktuell'];return['stale','älter']}
function cls(s){return s==='Fußball'?'football':s==='Handball'?'handball':'volleyball'}
function dtext(i){if(!i)return'–';let d=new Date(i);return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})+' · '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
function cd(i){if(!i)return'';let ms=new Date(i)-Date.now();if(ms<0)return'';let d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5);return d===0?(h<=1?'heute':'heute in '+h+' Std.'):d===1?'morgen':'in '+d+' Tagen'}
function render(){let selected=filter.value,clubs=allClubs.filter(c=>selected==='all'||c.sport===selected);grid.innerHTML=clubs.map(c=>{let [bc,bt]=badge(c),next=c.nextHomeAt?dtext(c.nextHomeAt)+' · '+esc(c.nextHomeOpponent):esc(c.nextHomeGame),count=cd(c.nextHomeAt),url=safeUrl(c.sourceUrl);return `<section class="card ${cls(c.sport)}"><div class="top"><div><div class="club">${esc(c.name)}</div><div class="league">${esc(c.league)}</div></div><span class="badge ${bc}">${bt}</span></div><div class="rankline"><span class="rank">${esc(c.rank)}</span><span class="ranklabel">Tabellenplatz</span></div><div class="info"><span class="label">Letztes Spiel</span><span class="value">${esc(c.lastResult)}</span></div><div class="info next"><span class="label">Heimspiel</span><span class="value">${next}${count?`<span class="countdown">${count}</span>`:''}</span></div><div class="foot"><span>${esc(c.sourceName)}</span>${url!=='#'?`<a class="leagueLink" href="${esc(url)}" target="_blank" rel="noopener noreferrer" title="Aktuelle Liga- bzw. Teamseite öffnen">Liga/Team ↗</a>`:''}<span>${c.dataUpdatedAt?new Date(c.dataUpdatedAt).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}):'–'}</span></div></section>`}).join('')}
async function loadData(manual=false){statusEl.textContent=manual?'Aktualisiere …':'Lade …';notice.style.display='none';try{let r=await fetch('data/sports-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);let data=await r.json();allClubs=data.clubs||[];let d=new Date(data.updatedAt);updated.textContent='Abruf: '+d.toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'});let stale=allClubs.filter(c=>badge(c)[0]==='stale').length,manuals=allClubs.filter(c=>c.sourceStatus==='manual').length;freshness.textContent=stale?stale+' Quelle(n) nicht frisch':'Datenquellen aktuell';statusEl.textContent='OK';if(stale||manuals){notice.textContent=(stale?stale+' Quelle(n) konnten zuletzt nicht frisch abgerufen werden. ':'')+(manuals?manuals+' Quelle(n) werden derzeit manuell verifiziert.':'');notice.style.display='block'}render()}catch(e){grid.innerHTML='<div>Datendatei konnte nicht geladen werden.</div>';updated.textContent='Keine Daten';statusEl.textContent='Fehler'}}
document.querySelector('#refresh').onclick=()=>loadData(true);filter.onchange=render;loadData();setInterval(loadData,300000);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
